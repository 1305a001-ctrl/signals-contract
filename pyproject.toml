[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "signals-contract"
version = "0.2.0"
description = "Shared pydantic event contract for the2357.com trading stack (Signal + Alpha + Position + Fill + KillEvent + RiskMeter + SourceScore + MacroEvent + Redis Streams helpers)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
